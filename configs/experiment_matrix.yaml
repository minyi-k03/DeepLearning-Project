# 실험 행렬 (SPEC.md §실험 행렬, ADR 0001~0008)
# 미정(TBD) 항목은 본 실험 전 결정 시 채웁니다.

experiments:
  - id: mnli_frozen_full
    dataset: mnli
    backbone_condition: frozen
    data_amount: full
    input_setting: null
    fusion_methods: [B0, F1, F2, F3, F4, B0+]
    layer_subset: all
    hypotheses: [H1, H4_prime]
    # 시드 목록은 중첩이다(T-07a): 핵심 비교 5시드 [0..4], 나머지·파인튜닝 3시드 [0..2].
    # H2·H3은 두 조건의 공통 시드로 판정한다(decision_rules.yaml, judgment.py).
    seeds: [0, 1, 2, 3, 4]  # 핵심 5시드

  - id: mnli_frozen_small
    dataset: mnli
    backbone_condition: frozen
    data_amount: small  # 클래스당 1,000건
    input_setting: null
    fusion_methods: null  # TBD (구현 단계에서 확정)
    layer_subset: all
    hypotheses: [H2]
    seeds: [0, 1, 2]

  - id: mnli_finetune_full
    dataset: mnli
    backbone_condition: finetune
    data_amount: full
    input_setting: null
    fusion_methods: [B0, BEST_FUSION]  # 가장 좋은 결합 방식은 H1/사전 규칙 기준 확정
    layer_subset: all
    hypotheses: [H3]
    seeds: [0, 1, 2]  # finetune_num_seeds = 3

  - id: sst2_frozen_full
    dataset: sst2
    backbone_condition: frozen
    data_amount: full
    input_setting: null
    fusion_methods: null  # TBD (층 가중치 비교에 F2 필수 포함)
    layer_subset: all
    hypotheses: [H4]
    seeds: [0, 1, 2]

  - id: imdb_frozen_length
    dataset: imdb
    backbone_condition: frozen
    data_amount: full
    input_settings: [L128, L512, Lfull]
    fusion_methods: [B0, F1, F2]
    layer_subset: all
    hypotheses: [H5a, H5b]
    seeds: [0, 1, 2, 3, 4]  # 핵심 5시드

  - id: imdb_frozen_layer_ablation
    dataset: imdb
    backbone_condition: frozen
    data_amount: full
    input_settings: [L128, L512, Lfull]
    fusion_methods: [F2]
    layer_subsets: [global_only, local_only]  # 임베딩 벡터 제외
    hypotheses: [H5c]
    seeds: [0, 1, 2]

  - id: imdb_frozen_lfull_f4
    dataset: imdb
    backbone_condition: frozen
    data_amount: full
    input_setting: Lfull
    fusion_methods: [F4]
    layer_subset: all
    hypotheses: [H5c]
    seeds: [0, 1, 2]

reproduction_track:
  # 본 실험 결과표와 분리됨 (ADR 0004). 학습률·가중치 감쇠·에폭은 논문 값
  # (arXiv 2412.13663v2 부록 E.1 Table 6, ModernBERT-base, PDF 원문 확인, T-06e).
  # batch_size·warmup_ratio·lr_scheduler·seeds는 논문에 없어 팀이 정한 관행 값(논문 값 아님,
  # 11/25 결정 안건 C, SPEC §결정 필요 사항). 보고서 한계 절에 적는다.
  - id: repro_mnli
    dataset: mnli
    track: reproduction
    backbone_condition: finetune
    data_amount: full
    num_runs: 3
    paper_reported_accuracy: 89.1
    paper_reported_error_rate: 10.9
    lr: 5.0e-5
    weight_decay: 5.0e-6
    epochs: 1
    batch_size: 32
    warmup_ratio: 0.06
    lr_scheduler: linear
    seeds: [0, 1, 2]

  - id: repro_sst2
    dataset: sst2
    track: reproduction
    backbone_condition: finetune
    data_amount: full
    num_runs: 3
    paper_reported_accuracy: 96.0
    paper_reported_error_rate: 4.0
    lr: 8.0e-5
    weight_decay: 1.0e-5
    epochs: 2
    batch_size: 32
    warmup_ratio: 0.06
    lr_scheduler: linear
    seeds: [0, 1, 2]
