# 1주차 확인으로 확정할 환경·데이터 설정 (SPEC.md §결정 필요 사항, ADR 0005/0006)
# 본 실험 실행 전에 모두 채워 고정해야 합니다.

backbone:
  model_name: "answerdotai/ModernBERT-base"
  num_layers: 22
  num_layer_vectors: 23  # 임베딩 벡터 1개 + 22개 층
  hidden_size: 768

runtime_lock:
  transformers_version: "5.23.0"   # T-02a 고정 (requirements.txt / pyproject / requirements.lock 일치)
  last_vector_is_final_norm: true  # 23번째 층 벡터 = final_norm(마지막 층 원출력) = last_hidden_state
  # 확인: T-02a, scripts/check_runtime_lock.py → docs/measurements/runtime_check_cpu.json (2026-11-18,
  #       CPU, sdpa·eager). GPU 서버에서 attn·compile 측정 시 같은 스크립트로 재확인.
  attn_implementation: null        # "flash_attention_2" | "sdpa" (ADR 0005) — GPU 서버 측정 후 팀 결정
  torch_compile: null              # true | false (ADR 0005) — GPU 서버 측정 후 팀 결정
  # 측정: python scripts/check_runtime_lock.py --device cuda --attn sdpa flash_attention_2 \
  #         --compile off on --benchmark-steps 20
  cache_dtype: null                # "float32" | "float16" (MNLI train ~28GB fp32 / ~14GB fp16)

imdb_length_check:
  observed_max_tokens: 3270        # ModernBERT 토크나이저로 측정한 IMDB 최대 토큰 길이 (train 3270 / test 2971, 특수 토큰 포함)
  lfull_max_length_cap: 4096       # 4096 이하면 자르지 않음, 초과 시 4096 유지 (ADR 0006) → 관측 최대 ≤ 4096이라 잘리는 문서 0건
  # 측정: T-02b, scripts/measure_imdb_lengths.py → docs/measurements/imdb_length_check.json (2026-11-15)

dataset_approval:
  mnli_approved: null              # 교수님 승인 여부 (거절 시 AG News 비상 계획, ADR 0003)
  sst2_approved: null              # 교수님 승인 여부 (미승인 시 제외, ADR 0003)

training_budget:
  lr_candidates: null              # 학습률 후보 3개 (튜닝 분할에서 선택, 모든 결합 방식 동일)
  epochs: null                     # 모든 결합 방식 동일 에폭 수
  early_stopping: null             # 모든 결합 방식 동일 조기 종료 기준
  batch_size: null
  finetune_lr_candidates: null     # 파인튜닝 조건 학습률 범위
  include_special_tokens_in_pool: null
  extract_time_included_in_train_time: null
