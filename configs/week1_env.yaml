# 1주차 확인으로 확정할 환경·데이터 설정 (SPEC.md §결정 필요 사항, ADR 0005/0006)
# 본 실험 실행 전에 모두 채워 고정해야 합니다.

backbone:
  model_name: "answerdotai/ModernBERT-base"
  num_layers: 22
  num_layer_vectors: 23  # 임베딩 벡터 1개 + 22개 층
  hidden_size: 768

runtime_lock:
  transformers_version: "5.23.0"   # T-02a 고정 (requirements.txt / pyproject / requirements.lock 일치)
  last_vector_is_final_norm: true  # 23번째 층 벡터 = final_norm(마지막 층 원출력) = last_hidden_state
  # 확인: T-02a, scripts/check_runtime_lock.py → docs/measurements/runtime_check_cpu.json (CPU, sdpa·eager),
  #       runtime_check_cuda.json (RTX 5090, sdpa compile 끔·켬) 모두 통과 (2026-11-18).
  attn_implementation: "sdpa"      # ADR 0005. 팀 결정 2026-11-18 (PR #5, 고용민 승인)
  torch_compile: false             # ADR 0005. 팀 결정 2026-11-18 (PR #5, 고용민 승인)
  # 근거: flash_attention_2는 별도 패키지·fp16/bf16 필요로 이 환경에서 동작하지 않음.
  #   compile: 백본 고정 조건은 백본을 캐시 생성 때 한 번만 실행해 이득이 거의 없고, compile은 실행 환경
  #   (gcc·libc6-dev)에 의존해 실패 위험이 있음. 측정(forward만, 32×512 고정 길이, 1회)은 끔 0.1071초 /
  #   켬 0.0971초. 파인튜닝(재현 트랙·T-08f)의 학습 시간은 T-08a에서 실측 후 필요하면 팀이 재검토(11/30 이전).
  # 측정 명령: python scripts/check_runtime_lock.py --device cuda --attn sdpa flash_attention_2 \
  #         --compile off on --benchmark-steps 20
  cache_dtype: null                # "float32" | "float16" (MNLI train ~28GB fp32 / ~14GB fp16)

imdb_length_check:
  observed_max_tokens: 3270        # ModernBERT 토크나이저로 측정한 IMDB 최대 토큰 길이 (train 3270 / test 2971, 특수 토큰 포함)
  lfull_max_length_cap: 4096       # 4096 이하면 자르지 않음 (ADR 0006). 관측 최대 3,270 ≤ 4096이라 잘리는 문서 0건.
  # 상한 초과 문서는 어느 부분을 남길지 ADR 0006에 없어 inputs.build_tokenized_inputs가 오류로 멈춤(PR #8 팀 합의).
  # 측정: T-02b, scripts/measure_imdb_lengths.py → docs/measurements/imdb_length_check.json (2026-11-15)

dataset_approval:
  mnli_approved: true              # 교수님 승인 여부 (거절 시 AG News 비상 계획, ADR 0003) — 승인 확정 (T-02c, 2026-11-18)
  sst2_approved: true              # 교수님 승인 여부 (미승인 시 제외, ADR 0003) — 승인 확정 (T-02c, 2026-11-18)

training_budget:
  lr_candidates: null              # 학습률 후보 3개 (튜닝 분할에서 선택, 모든 결합 방식 동일)
  epochs: null                     # 모든 결합 방식 동일 에폭 수
  early_stopping: null             # 모든 결합 방식 동일 조기 종료 기준
  batch_size: null
  finetune_lr_candidates: null     # 파인튜닝 조건 학습률 범위
  include_special_tokens_in_pool: null
  extract_time_included_in_train_time: null
